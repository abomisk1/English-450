<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لوحة إدارة المحتوى والمراجعة الشرعية — بَرْدُ اليقين</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../assets/img/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <span class="topbar__title">لوحة إدارة المحتوى والمراجعة الشرعية</span>
      <span class="topbar__spacer"></span>
      <a class="btn btn--quiet btn--sm" href="../index.html">العودة للبرنامج</a>
    </header>
    <main id="main" tabindex="-1">
      <div class="container section stack" id="view">
        <p class="muted">جارٍ التحميل…</p>
      </div>
    </main>
  </div>

<script type="module">
import { h, ar, toast } from '../js/lib/dom.js';

const view = document.getElementById('view');
const BASE = '../content/';

async function j(p) { const r = await fetch(BASE + p, { cache: 'no-cache' }); if (!r.ok) throw new Error(p); return r.json(); }

const KIND_AR = {
  'card:quran': 'نصّ قرآني', 'card:hadith': 'حديث', 'card:dhikr': 'ذكر/دعاء',
  'card:note': 'ملحوظة تعليمية', 'card:text': 'نصّ', 'card:list': 'قائمة', 'card:hook': 'مدخل',
  hook: 'مدخل الدرس', objective: 'هدف الدرس', summary: 'خلاصة الدرس', family: 'سؤال أسري',
  'interaction:scenario': 'موقف تطبيقي', 'quiz:scenario': 'موقف تطبيقي في الاختبار',
};

/** حالة الاعتماد تُحفظ محليًّا في هذا الجهاز (مراجعة داخلية قبل النشر). */
const RK = 'bay.review.v1';
function loadReview() { try { return JSON.parse(localStorage.getItem(RK) || '{}'); } catch { return {}; } }
function saveReview(o) { try { localStorage.setItem(RK, JSON.stringify(o)); } catch {} }

async function boot() {
  let manifest, review, units;
  try {
    [manifest, review] = await Promise.all([j('manifest.json'), j('needs-review.json')]);
    units = await Promise.all(manifest.units.map((u) => j(u.file)));
  } catch (e) {
    view.replaceChildren(h('div', { class: 'card' },
      h('h2', {}, 'تعذّر تحميل المحتوى'),
      h('p', { class: 'small muted' }, 'شغّل البرنامج عبر خادم ملفات محلي (لا عبر file://).')));
    return;
  }

  const decisions = loadReview();
  const counts = () => {
    const total = review.items.length;
    const approved = review.items.filter((_, i) => (decisions[key(i)] || {}).status === 'approved').length;
    const changed = review.items.filter((_, i) => (decisions[key(i)] || {}).status === 'needs-change').length;
    return { total, approved, changed, pending: total - approved - changed };
  };
  const key = (i) => review.items[i].path + '#' + review.items[i].kind;

  const stats = h('div', { class: 'card' });
  const paintStats = () => {
    const c = counts();
    stats.replaceChildren(
      h('h2', { style: { marginTop: 0 } }, 'حالة المراجعة الشرعية'),
      h('p', { class: 'small muted' }, review.policy),
      h('div', { class: 'row' },
        h('span', { class: 'chip' }, `الإجمالي: ${ar(c.total)}`),
        h('span', { class: 'chip chip--ok' }, `معتمَد: ${ar(c.approved)}`),
        h('span', { class: 'chip chip--err' }, `يحتاج تعديلًا: ${ar(c.changed)}`),
        h('span', { class: 'chip chip--warn' }, `بانتظار المراجعة: ${ar(c.pending)}`)),
      h('div', { class: 'row', style: { marginTop: '.75rem' } },
        h('button', { class: 'btn btn--ghost btn--sm', type: 'button', onclick: exportDecisions }, 'تصدير قرارات المراجعة'),
        h('button', { class: 'btn btn--quiet btn--sm', type: 'button', onclick: () => {
          if (confirm('مسح جميع قرارات المراجعة على هذا الجهاز؟')) { saveReview({}); location.reload(); }
        } }, 'مسح القرارات')),
    );
  };

  function exportDecisions() {
    const rows = review.items.map((it, i) => ({ ...it, decision: decisions[key(i)] || { status: 'pending' } }));
    const blob = new Blob([JSON.stringify({ generatedAt: new Date().toISOString(), rows }, null, 1)],
      { type: 'application/json' });
    const a = h('a', { href: URL.createObjectURL(blob), download: 'review-decisions.json' });
    document.body.append(a); a.click(); a.remove();
    toast('تم التصدير.');
  }

  /* ---- تبويبات ---- */
  const panes = {};
  const tabs = h('div', { class: 'mode-switch', style: { flexWrap: 'wrap' } });
  const paneHost = h('div', {});
  const addTab = (id, label, build) => {
    const b = h('button', { class: 'mode-switch__btn', type: 'button' }, label);
    b.addEventListener('click', () => {
      [...tabs.children].forEach((c) => c.setAttribute('aria-pressed', String(c === b)));
      paneHost.replaceChildren(build());
    });
    tabs.append(b);
    panes[id] = { b, build };
  };

  addTab('review', 'قائمة المراجعة', buildReviewList);
  addTab('content', 'خريطة المحتوى', buildContentMap);
  addTab('guide', 'دليل الإدارة', buildGuide);

  view.replaceChildren(stats, tabs, paneHost);
  paintStats();
  panes.review.b.click();

  /* ---- قائمة المراجعة ---- */
  function buildReviewList() {
    const wrap = h('div', { class: 'stack' });
    const filter = h('select', { class: 'select', style: { maxWidth: '16rem' } },
      h('option', { value: 'pending' }, 'بانتظار المراجعة'),
      h('option', { value: 'all' }, 'الكل'),
      h('option', { value: 'quran' }, 'النصوص القرآنية فقط'),
      h('option', { value: 'authored' }, 'الصياغات التعليمية المساعدة'),
      h('option', { value: 'approved' }, 'المعتمَد'),
      h('option', { value: 'needs-change' }, 'يحتاج تعديلًا'));
    const listHost = h('div', { class: 'stack' });

    const paint = () => {
      const f = filter.value;
      const rows = review.items.map((it, i) => ({ it, i })).filter(({ it, i }) => {
        const st = (decisions[key(i)] || {}).status || 'pending';
        if (f === 'all') return true;
        if (f === 'quran') return it.src === 'quran';
        if (f === 'authored') return it.src === 'authored';
        return st === f;
      });
      listHost.replaceChildren(h('p', { class: 'small muted' }, `${ar(rows.length)} عنصرًا`));
      for (const { it, i } of rows) {
        const k = key(i);
        const d = decisions[k] || { status: 'pending', note: '' };
        const note = h('textarea', {
          class: 'textarea', placeholder: 'ملحوظة المراجع (اختياري)…', value: d.note || '',
          style: { minHeight: '64px' },
          oninput: (e) => { decisions[k] = { ...(decisions[k] || { status: 'pending' }), note: e.target.value }; saveReview(decisions); },
        });
        const setStatus = (status) => {
          decisions[k] = { ...(decisions[k] || {}), status, note: note.value, at: Date.now() };
          saveReview(decisions); paintStats(); paint();
        };
        listHost.append(h('div', { class: 'card stack' },
          h('div', { class: 'row', style: { justifyContent: 'space-between' } },
            h('span', { class: 'chip ' + (it.src === 'quran' ? 'chip--brand' : 'chip--warn') },
              KIND_AR[it.kind] || it.kind),
            h('span', { class: 'xsmall muted' },
              [it.ref, it.page ? 'ص ' + ar(it.page) : null, it.path].filter(Boolean).join(' · '))),
          h('div', { class: it.src === 'quran' ? 'quran' : 'book-text' }, it.excerpt),
          note,
          h('div', { class: 'row' },
            h('button', { class: 'btn btn--sm ' + (d.status === 'approved' ? 'btn--accent' : 'btn--ghost'),
              type: 'button', onclick: () => setStatus('approved') }, '✓ معتمَد'),
            h('button', { class: 'btn btn--sm ' + (d.status === 'needs-change' ? 'btn--accent' : 'btn--ghost'),
              type: 'button', onclick: () => setStatus('needs-change') }, '✎ يحتاج تعديلًا'),
            h('button', { class: 'btn btn--quiet btn--sm', type: 'button', onclick: () => setStatus('pending') }, 'إعادة للانتظار'),
          ),
        ));
      }
    };
    filter.addEventListener('change', paint);
    paint();
    wrap.append(h('div', { class: 'row' }, h('span', { class: 'small muted' }, 'تصفية:'), filter), listHost);
    return wrap;
  }

  /* ---- خريطة المحتوى ---- */
  function buildContentMap() {
    const wrap = h('div', { class: 'stack' });
    wrap.append(h('div', { class: 'card' },
      h('h2', { style: { marginTop: 0 } }, 'إحصاءات المحتوى'),
      h('div', { class: 'row' },
        ...Object.entries(manifest.stats).map(([k, v]) => h('span', { class: 'chip' }, `${k}: ${ar(v)}`)))));
    for (const u of units) {
      const t = h('table', { class: 'tbl' },
        h('thead', {}, h('tr', {},
          h('th', {}, 'الدرس'), h('th', {}, 'صفحات الكتاب'),
          h('th', {}, 'بطاقات'), h('th', {}, 'تفاعلات'), h('th', {}, 'أسئلة'))),
        h('tbody', {}, ...u.lessons.map((l) => h('tr', {},
          h('td', {}, l.title),
          h('td', {}, l.source.pages.map(ar).join('، ')),
          h('td', {}, ar(l.cards.length)),
          h('td', {}, ar(l.interactions.length)),
          h('td', {}, ar(l.quiz.length))))));
      wrap.append(h('div', { class: 'card' },
        h('h3', { style: { marginTop: 0 } }, `${ar(u.order)}. ${u.title}`),
        h('div', { class: 'small muted' }, `ص ${ar(u.source.pages[0])}–${ar(u.source.pages[1])} · ${ar(u.tasks.length)} مهام أدائية · ${ar(u.assessment.length)} أسئلة تحصيلية`),
        h('div', { class: 'scroll-x' }, t)));
    }
    return wrap;
  }

  /* ---- دليل الإدارة ---- */
  function buildGuide() {
    return h('div', { class: 'card stack' },
      h('h2', { style: { marginTop: 0 } }, 'دليل مختصر لإدارة المحتوى'),
      h('ol', { style: { lineHeight: '2', paddingInlineStart: '1.3rem' } },
        h('li', {}, 'المحتوى العلمي كله في مجلد ', h('code', {}, 'content/'), ' منفصلًا عن الشفرة: '
          , h('code', {}, 'manifest.json'), ' للفهرس، و', h('code', {}, 'units/uN.json'), ' لكل وحدة.'),
        h('li', {}, 'كل عنصر يحمل حقل ', h('code', {}, 'src'), ': ',
          h('code', {}, 'book'), ' منقول من الكتاب، ',
          h('code', {}, 'quran'), ' نصّ قرآني، ',
          h('code', {}, 'derived'), ' نشاط مبنيّ على نصّ الكتاب، ',
          h('code', {}, 'authored'), ' صياغة تعليمية مساعدة.'),
        h('li', {}, 'كل عنصر ', h('code', {}, 'quran'), ' أو ', h('code', {}, 'authored'),
          ' يحمل ', h('code', {}, 'needsReview: true'), ' ويظهر في قائمة المراجعة أعلاه.'),
        h('li', {}, 'كل بطاقة تحمل ', h('code', {}, 'page'), ' يشير إلى صفحة الكتاب، فيمكن تتبّع مصدر أي نصّ.'),
        h('li', {}, 'لإضافة تسجيل صوتي معتمد: أضف ', h('code', {}, '"audio": "assets/audio/xxx.mp3"'),
          ' إلى البطاقة، ويتحوّل زر الاستماع تلقائيًّا إلى التسجيل. '
          , h('strong', {}, 'ولا تُقرأ الآيات قراءة آلية بأي حال.')),
        h('li', {}, 'بعد تعديل ملفات ', h('code', {}, 'scripts/content/*.py'), ' شغّل ',
          h('code', {}, 'python3 scripts/build_content.py'), ' لإعادة توليد JSON وقائمة المراجعة.'),
        h('li', {}, 'يمكن التعديل مباشرة على ملفات JSON دون إعادة البناء؛ يكفي رفعها.'),
        h('li', {}, 'لإضافة الجزء الثاني: أضف ', h('code', {}, 'part2'), ' في ', h('code', {}, 'parts'),
          ' وملفات وحدات جديدة، ولا حاجة لتغيير الشفرة.'),
        h('li', {}, 'قرارات المراجعة تُحفظ في هذا المتصفح؛ صدّرها بزر «تصدير قرارات المراجعة» لتوثيقها.'),
      ));
  }
}
boot();
</script>
</body>
</html>
